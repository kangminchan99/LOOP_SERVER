# 개발용 Compose와 별도 프로젝트·포트·임시 저장소를 사용한다.
name: loop-integration
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: loop_test
      POSTGRES_PASSWORD: loop_test_only
      POSTGRES_DB: loop_integration_test
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U loop_test -d loop_integration_test']
      interval: 2s
      timeout: 3s
      retries: 20
  redis-test:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:56379:6379'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20
